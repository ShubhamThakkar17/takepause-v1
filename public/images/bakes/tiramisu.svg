<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300"><style>.tw,.bob,.flag,.drift,.flame,.grow,.whisk,.sway{transform-box:fill-box}.tw{transform-origin:center;animation:tw 2.8s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(45deg);opacity:.55}}.bob{transform-origin:50% 0;animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}.flag{transform-origin:0 50%;animation:flag 1.6s ease-in-out infinite}@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-7deg) scaleX(.9)}}.drift{transform-origin:center;animation:drift 6s ease-in-out infinite}@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-16px) rotate(50deg)}}.steam{animation:steam 2.8s ease-in-out infinite}@keyframes steam{0%{transform:translateY(5px);opacity:0}40%{opacity:.75}100%{transform:translateY(-9px);opacity:0}}.flame{transform-origin:50% 100%;animation:flame .8s ease-in-out infinite alternate}@keyframes flame{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.82,1.14) rotate(4deg)}}.squeeze{animation:squeeze 2.4s ease-in-out infinite}@keyframes squeeze{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,16px)}}.grow{transform-origin:50% 100%;animation:grow 2.4s ease-in-out infinite}@keyframes grow{0%,100%{transform:scale(.86)}50%{transform:scale(1.06)}}.whisk{transform-origin:50% 0;animation:bob 1.3s ease-in-out infinite}.sway{transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="214" cy="258" rx="158" ry="30" fill="#38231E" opacity="0.12"/><ellipse cx="208" cy="248" rx="158" ry="30" fill="#FFF8F1" stroke="#38231E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="208" cy="246" 