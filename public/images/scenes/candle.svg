<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120"><style>.tw,.bob,.flag,.drift,.flame,.grow,.whisk,.sway{transform-box:fill-box}.tw{transform-origin:center;animation:tw 2.8s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(45deg);opacity:.55}}.bob{transform-origin:50% 0;animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}.flag{transform-origin:0 50%;animation:flag 1.6s ease-in-out infinite}@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-7deg) scaleX(.9)}}.drift{transform-origin:center;animation:drift 6s ease-in-out infinite}@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-16px) rotate(50deg)}}.steam{animation:steam 2.8s ease-in-out infinite}@keyframes steam{0%{transform:translateY(5px);opacity:0}40%{opacity:.75}100%{transform:translateY(-9px);opacity:0}}.flame{transform-origin:50% 100%;animation:flame .8s ease-in-out infinite alternate}@keyframes flame{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.82,1.14) rotate(4deg)}}.squeeze{animation:squeeze 2.4s ease-in-out infinite}@keyframes squeeze{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,16px)}}.grow{transform-origin:50% 100%;animation:grow 2.4s ease-in-out infinite}@keyframes grow{0%,100%{transform:scale(.86)}50%{transform:scale(1.06)}}.whisk{transform-origin:50% 0;animation:bob 1.3s ease-in-out infinite}.sway{transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="80" cy="108" rx="56" ry="6" fill="#38231E" opacity="0.12"/><ellipse cx="78" cy="104" rx="56" ry="10" fill="#FFF8F1" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 78 L110 66 L130 78 L130 98 L30 100 Z" fill="#FFF8F1" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 78 L130 78 L130 98 L30 100 Z" fill="#FFCAD4" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 88 L130 88" stroke="#8E2938" stroke-width="4"/><path d="M30 78 L110 66 L130 78 Z" fill="#FFCAD4" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="82" y="34" width="8" height="38" rx="2" fill="#F4DEA4" stroke="#38231E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path class="flame" d="M86 30 q-8 -10 0 -22 q8 12 0 22 Z" fill="#E9C774" stroke="#38231E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M116 19 Q117.26 24.74 123 26 Q117.26 27.26 116 33 Q114.74 27.26 109 26 Q114.74 24.74 116 19 Z" fill="#8E2938" class="tw" style="animation-delay:-1.7s"/><path d="M48 35 Q48.9 39.1 53 40 Q48.9 40.9 48 45 Q47.1 40.9 43 40 Q47.1 39.1 48 35 Z" fill="#1F5B3A" class="tw" style="animation-delay:-1.2s"/></svg>
