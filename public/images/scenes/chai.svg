<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120"><style>.tw,.bob,.flag,.drift,.flame,.grow,.whisk,.sway{transform-box:fill-box}.tw{transform-origin:center;animation:tw 2.8s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(45deg);opacity:.55}}.bob{transform-origin:50% 0;animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}.flag{transform-origin:0 50%;animation:flag 1.6s ease-in-out infinite}@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-7deg) scaleX(.9)}}.drift{transform-origin:center;animation:drift 6s ease-in-out infinite}@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-16px) rotate(50deg)}}.steam{animation:steam 2.8s ease-in-out infinite}@keyframes steam{0%{transform:translateY(5px);opacity:0}40%{opacity:.75}100%{transform:translateY(-9px);opacity:0}}.flame{transform-origin:50% 100%;animation:flame .8s ease-in-out infinite alternate}@keyframes flame{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.82,1.14) rotate(4deg)}}.squeeze{animation:squeeze 2.4s ease-in-out infinite}@keyframes squeeze{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,16px)}}.grow{transform-origin:50% 100%;animation:grow 2.4s ease-in-out infinite}@keyframes grow{0%,100%{transform:scale(.86)}50%{transform:scale(1.06)}}.whisk{transform-origin:50% 0;animation:bob 1.3s ease-in-out infinite}.sway{transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="70" cy="106" rx="50" ry="6" fill="#38231E" opacity="0.12"/><ellipse cx="66" cy="102" rx="50" ry="10" fill="#FFF8F1" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 54 L36 96 Q66 106 96 96 L102 54 Z" fill="#FFF8F1" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="66" cy="54" rx="36" ry="9" fill="#9A6A45" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 62 q20 0 18 16 q-2 14 -20 12" fill="none" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 70 q26 8 52 0" fill="none" stroke="#8E2938" stroke-width="4"/><path class="steam" d="M56 38 q-8 -10 0 -18 q8 -8 0 -16 M76 38 q-8 -10 0 -18 q8 -8 0 -16" fill="none" stroke="#38231E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><path d="M150 102.5 Q149.1 105.1 144.7 107 Q140.3 108.9 134.2 109.3 Q128 109.8 121.9 109.3 Q115.8 108.8 111.9 106.8 Q108.1 104.8 106.3 102.4 Q104.6 100 106 97.5 Q107.4 95.1 111.8 93.2 Q116.1 91.4 122.1 90.6 Q128 89.8 134.3 90.4 Q140.5 91 144.7 93 Q149 95 149.9 97.5 Q150.8 100 150 102.5 Z" fill="#D9A066" stroke="#38231E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M122.1 100 Q121.6 101.9 119.4 100.8 Q117.2 99.6 117.3 98.1 Q117.4 96.5 119.4 95.5 Q121.4 94.5 122 96.2 Q122.6 98 122.1 100 Z" fill="#4E2A1E" stroke="#38231E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M135.8 103.2 Q135 104.4 132.5 104.3 Q130.1 104.3 130.8 102.4 Q131.6 100.6 133.5 99.5 Q135.5 98.3 136 100.2 Q136.6 102 135.8 103.2 Z" fill="#4E2A1E" stroke="#38231E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
