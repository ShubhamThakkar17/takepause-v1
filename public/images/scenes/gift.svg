<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120"><style>.tw,.bob,.flag,.drift,.flame,.grow,.whisk,.sway{transform-box:fill-box}.tw{transform-origin:center;animation:tw 2.8s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(45deg);opacity:.55}}.bob{transform-origin:50% 0;animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}.flag{transform-origin:0 50%;animation:flag 1.6s ease-in-out infinite}@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-7deg) scaleX(.9)}}.drift{transform-origin:center;animation:drift 6s ease-in-out infinite}@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-16px) rotate(50deg)}}.steam{animation:steam 2.8s ease-in-out infinite}@keyframes steam{0%{transform:translateY(5px);opacity:0}40%{opacity:.75}100%{transform:translateY(-9px);opacity:0}}.flame{transform-origin:50% 100%;animation:flame .8s ease-in-out infinite alternate}@keyframes flame{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.82,1.14) rotate(4deg)}}.squeeze{animation:squeeze 2.4s ease-in-out infinite}@keyframes squeeze{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,16px)}}.grow{transform-origin:50% 100%;animation:grow 2.4s ease-in-out infinite}@keyframes grow{0%,100%{transform:scale(.86)}50%{transform:scale(1.06)}}.whisk{transform-origin:50% 0;animation:bob 1.3s ease-in-out infinite}.sway{transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="84" cy="108" rx="54" ry="6" fill="#38231E" opacity="0.12"/><rect x="34" y="52" width="100" height="54" rx="4" fill="#8E2938" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="28" y="40" width="112" height="18" rx="4" fill="#8E2938" stroke="#38231E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="76" y="40" width="16" height="66" fill="#F4DEA4" stroke="#38231E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M84 40 C60 10 40 26 58 38 Z M84 40 C108 10 128 26 110 38 Z" fill="#F4DEA4" stroke="#38231E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M84 40 l-10 18 M84 40 l10 18" stroke="#38231E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M138 14 Q139.44 20.56 146 22 Q139.44 23.44 138 30 Q136.56 23.44 130 22 Q136.56 20.56 138 14 Z" fill="#1F5B3A" class="tw" style="animation-delay:-2.8s"/><path d="M24 18 Q25.08 22.92 30 24 Q25.08 25.08 24 30 Q22.92 25.08 18 24 Q22.92 22.92 24 18 Z" fill="#8E2938" class="tw" style="animation-delay:-2s"/></svg>
